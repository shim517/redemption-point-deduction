apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: datadog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: datadog
    template:
      data:
        address: "https://api.datadoghq.com"
        api-key: "{{ .apiKey }}"
        app-key: "{{ .appKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: redemption/datadog
        property: api-key
    - secretKey: appKey
      remoteRef:
        key: redemption/datadog
        property: app-key
