apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: redemption
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: redemption
  minReplicaCount: 3
  maxReplicaCount: 60
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
    - type: cron
      metadata:
        timezone: Asia/Bangkok
        start: "50 13 * * 5"   # 10 min before a 14:00 Flash Sale — adjust per event
        end:   "30 15 * * 5"
        desiredReplicas: "60"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
